name: OKR to M3U8 and Deploy V2

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'ID video OK.ru hoặc URL'
        required: true
      name:
        description: 'Tên file (slug) để deploy'
        required: true
      token:
        description: 'Cloudflare API Token'
        required: true
      projectName:
        description: 'Tên project Pages'
        required: true
      accountId:
        description: 'Cloudflare Account ID'
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 jq
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade requests --break-system-packages

      - name: Download Video from OK.ru
        id: download
        run: |
          set -e

          RAW_URL="${{ github.event.inputs.link }}"

          # Chuyển ID số thành URL nếu cần
          if [[ "$RAW_URL" =~ ^[0-9]+$ ]]; then
            URL="https://ok.ru/video/$RAW_URL"
          else
            URL="$RAW_URL"
          fi

          echo "Downloading from: $URL"

          # ------------------------------------------------------------
          # Script trích xuất link video trực tiếp từ OK.ru (không phụ
          # thuộc yt-dlp). Ghi ra file tạm rồi chạy.
          # ------------------------------------------------------------
          cat > okru_extract.py << 'PYEOF'
          #!/usr/bin/env python3
          import argparse
          import html
          import json
          import re
          import sys
          from urllib.parse import unquote
          
          import requests
          
          QUALITY_HEIGHT = {
              "ultra": 2160, "quad": 1440, "full": 1080, "hd": 720,
              "sd": 480, "low": 360, "lowest": 240, "mobile": 144,
          }
          
          DEFAULT_HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "ru-RU,ru;q=0.9,en-US;q=0.8,en;q=0.7",
          }
          
          
          def extract_id(url_or_id):
              if url_or_id.isdigit():
                  return url_or_id
              m = re.search(r"(?:video|videoembed)/([\d-]+)", url_or_id)
              if not m:
                  raise ValueError(f"Khong tim thay ID video trong: {url_or_id}")
              return m.group(1)
          
          
          def maybe_parse_json(value, label="metadata"):
              if isinstance(value, (dict, list)):
                  return value
              if isinstance(value, (str, bytes, bytearray)):
                  return json.loads(value)
              raise TypeError(f"Khong the parse {label}: kieu du lieu khong xac dinh {type(value)}")
          
          
          def fetch_desktop_metadata(video_id, cookies=None, verbose=False):
              url = f"https://ok.ru/video/{video_id}"
              headers = dict(DEFAULT_HEADERS)
              if cookies:
                  headers["Cookie"] = cookies
              if verbose:
                  print(f"[*] Dang tai trang: {url}", file=sys.stderr)
          
              resp = requests.get(url, headers=headers, timeout=30)
              resp.raise_for_status()
              webpage = resp.text
          
              m = re.search(r'data-options=(["\'])(?P<opts>\{.+?\})\1', webpage)
              if not m:
                  m = re.search(r'data-options="(?P<opts>[^"]+)"', webpage)
              if not m:
                  raise RuntimeError(
                      "Khong tim thay 'data-options' trong HTML. OK.ru co the da doi "
                      "cau truc trang, hoac trang tra ve loi (dang nhap/khoa vung/chan IP)."
                  )
          
              raw_opts = html.unescape(m.group("opts"))
              player = maybe_parse_json(raw_opts, "player data-options")
          
              if isinstance(player, dict) and player.get("isExternalPlayer") and player.get("url"):
                  return {"external_player_url": player["url"], "videos": []}
          
              flashvars = player.get("flashvars", player) if isinstance(player, dict) else player
              metadata_field = flashvars.get("metadata") if isinstance(flashvars, dict) else None
          
              if metadata_field:
                  metadata = maybe_parse_json(metadata_field, "metadata (inline)")
              else:
                  metadata_url = flashvars.get("metadataUrl") if isinstance(flashvars, dict) else None
                  if not metadata_url:
                      raise RuntimeError("Khong tim thay 'metadata' hoac 'metadataUrl' trong flashvars.")
                  post_data = {}
                  location = flashvars.get("location")
                  if location:
                      post_data["st.location"] = location
                  if verbose:
                      print(f"[*] Dang tai metadata JSON tu: {unquote(metadata_url)}", file=sys.stderr)
                  resp2 = requests.post(unquote(metadata_url), data=post_data, headers=headers, timeout=30)
                  resp2.raise_for_status()
                  metadata = maybe_parse_json(resp2.text, "metadata (remote)")
          
              return metadata
          
          
          def fetch_mobile_fallback(video_id, verbose=False):
              url = f"https://m.ok.ru/video/{video_id}"
              if verbose:
                  print(f"[*] Thu trang mobile: {url}", file=sys.stderr)
              resp = requests.get(url, headers=DEFAULT_HEADERS, timeout=30)
              resp.raise_for_status()
              webpage = resp.text
          
              m = re.search(r'data-video="(.+?)"', webpage)
              if not m:
                  raise RuntimeError("Khong tim thay data-video tren trang mobile.")
              data = maybe_parse_json(html.unescape(m.group(1)), "mobile data-video")
          
              return {
                  "movie": {"title": data.get("videoName")},
                  "videos": [{"name": "mobile", "url": data.get("videoSrc")}] if data.get("videoSrc") else [],
              }
          
          
          def pick_best_format(videos, max_height):
              candidates = []
              for f in videos:
                  name = f.get("name")
                  url = f.get("url")
                  if not url:
                      continue
                  height = QUALITY_HEIGHT.get(name, 0)
                  candidates.append((height, name, url))
          
              eligible = [c for c in candidates if 0 < c[0] <= max_height]
              if eligible:
                  eligible.sort(key=lambda c: c[0], reverse=True)
                  return eligible[0]
              if candidates:
                  candidates.sort(key=lambda c: c[0])
                  return candidates[0]
              return None
          
          
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("url_or_id")
              parser.add_argument("--max-height", type=int, default=1080)
              parser.add_argument("--cookies", default=None)
              parser.add_argument("--verbose", action="store_true")
              args = parser.parse_args()
          
              video_id = extract_id(args.url_or_id)
          
              try:
                  metadata = fetch_desktop_metadata(video_id, cookies=args.cookies, verbose=args.verbose)
              except Exception as e:
                  print(f"[!] Loi khi lay du lieu tu trang desktop: {e}", file=sys.stderr)
                  print("[*] Dang thu phuong an du phong (trang mobile)...", file=sys.stderr)
                  metadata = fetch_mobile_fallback(video_id, verbose=args.verbose)
          
              if "external_player_url" in metadata:
                  print(f"EXTERNAL:{metadata['external_player_url']}")
                  return
          
              videos = metadata.get("videos", [])
              hls = metadata.get("hlsManifestUrl") or metadata.get("hlsMasterPlaylistUrl")
          
              best = pick_best_format(videos, args.max_height)
              if best:
                  _, name, url = best
                  print(f"MP4:{url}")
              elif hls:
                  print(f"HLS:{hls}")
              else:
                  print("[!] Khong tim thay format nao co the tai duoc.", file=sys.stderr)
                  sys.exit(2)
          
          
          if __name__ == "__main__":
              main()
          PYEOF

          # Chạy script, lấy dòng kết quả cuối cùng (VD: "MP4:https://..." hoặc "HLS:https://...")
          RESULT=$(python3 okru_extract.py "$URL" --max-height 1080 --verbose)
          echo "$RESULT"

          LAST_LINE=$(echo "$RESULT" | tail -1)
          KIND="${LAST_LINE%%:*}"
          VIDEO_URL="${LAST_LINE#*:}"

          if [ -z "$VIDEO_URL" ]; then
            echo "Khong lay duoc link video truc tiep."
            exit 1
          fi

          echo "Loai link: $KIND"
          echo "Video URL: $VIDEO_URL"

          if [ "$KIND" = "HLS" ]; then
            # Link .m3u8 -> dùng ffmpeg để tải/ghép luôn thành mp4
            ffmpeg -y -i "$VIDEO_URL" -c copy input_video.mp4
          else
            # Link .mp4 trực tiếp -> dùng aria2c tải đa luồng cho nhanh
            aria2c \
              --max-connection-per-server=16 \
              --split=16 \
              --out=input_video.mp4 \
              "$VIDEO_URL"
          fi

          # Kiểm tra file tồn tại và size > 0
          if [ ! -s input_video.mp4 ]; then
            echo "Download failed or file empty"
            exit 1
          fi

      # ============================================================
      # CHECK BITRATE VÀ ENCODE NẾU > 3 Mbps
      # ============================================================
      - name: Check Bitrate and Encode if Needed
        run: |
          set -e

          INPUT_FILE="input_video.mp4"
          FINAL_INPUT="encoded_video.mp4"

          echo "=========================================="
          echo "Checking downloaded video..."
          echo "=========================================="

          # --------------------------------------------------------
          # Lấy thời lượng video
          # --------------------------------------------------------
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT_FILE")

          if [ -z "$DURATION" ] || [ "$DURATION" = "N/A" ]; then
            echo "Cannot determine video duration"
            exit 1
          fi

          # --------------------------------------------------------
          # Lấy tổng dung lượng file MP4
          #
          # File này đã bao gồm cả VIDEO + AUDIO sau khi yt-dlp
          # merge xong.
          # --------------------------------------------------------
          FILE_SIZE_BYTES=$(stat -c%s "$INPUT_FILE")

          # --------------------------------------------------------
          # Tính bitrate trung bình theo Mbps
          #
          # Mbps = bytes * 8 / seconds / 1,000,000
          # --------------------------------------------------------
          AVG_MBPS=$(awk \
            -v size="$FILE_SIZE_BYTES" \
            -v duration="$DURATION" \
            'BEGIN {
              printf "%.4f", (size * 8) / duration / 1000000
            }')

          FILE_SIZE_MB=$(awk \
            -v size="$FILE_SIZE_BYTES" \
            'BEGIN {
              printf "%.2f", size / 1000000
            }')

          DURATION_MINUTES=$(awk \
            -v duration="$DURATION" \
            'BEGIN {
              printf "%.2f", duration / 60
            }')

          echo "=========================================="
          echo "VIDEO INFORMATION"
          echo "=========================================="
          echo "Duration       : ${DURATION_MINUTES} minutes"
          echo "File size      : ${FILE_SIZE_MB} MB"
          echo "Average bitrate: ${AVG_MBPS} Mbps"
          echo "Threshold      : 3 Mbps"
          echo "=========================================="

          # --------------------------------------------------------
          # Nếu bitrate > 3 Mbps thì encode lại H264
          # --------------------------------------------------------
          if awk "BEGIN {exit !($AVG_MBPS > 3)}"; then

            echo "Video là ${AVG_MBPS} Mbps."
            echo "Lớn hơn 3 Mbps."
            echo "Bắt đầu chuyển đổi sang H264..."

            # Lấy codec hiện tại để log
            VIDEO_CODEC=$(ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of default=noprint_wrappers=1:nokey=1 \
              "$INPUT_FILE")

            echo "Video codec hiện tại: $VIDEO_CODEC"

            # ------------------------------------------------------
            # Encode theo đúng cấu hình bạn đã gửi
            # ------------------------------------------------------
            ffmpeg -y -i "$INPUT_FILE" \
              -map 0:v:0 -map 0:a? \
              -c:v libx264 \
              -pix_fmt yuv420p \
              -profile:v high \
              -level 4.1 \
              -crf 23 \
              -preset medium \
              -maxrate 2000k \
              -bufsize 3500k \
              -force_key_frames "expr:gte(t,n_forced*5)" \
              -sc_threshold 0 \
              -c:a aac \
              -b:a 128k \
              -ac 2 \
              -threads 0 \
              -movflags +faststart \
              "$FINAL_INPUT"

            # Kiểm tra encode thành công
            if [ ! -s "$FINAL_INPUT" ]; then
              echo "Encoding failed"
              exit 1
            fi

            # ------------------------------------------------------
            # Thay file gốc bằng file đã encode
            # ------------------------------------------------------
            mv "$FINAL_INPUT" "$INPUT_FILE"

            # ------------------------------------------------------
            # Hiển thị kết quả sau encode
            # ------------------------------------------------------
            NEW_SIZE_BYTES=$(stat -c%s "$INPUT_FILE")

            NEW_SIZE_MB=$(awk \
              -v size="$NEW_SIZE_BYTES" \
              'BEGIN {
                printf "%.2f", size / 1000000
              }')

            NEW_MBPS=$(awk \
              -v size="$NEW_SIZE_BYTES" \
              -v duration="$DURATION" \
              'BEGIN {
                printf "%.4f", (size * 8) / duration / 1000000
              }')

            echo "=========================================="
            echo "ENCODE COMPLETED"
            echo "=========================================="
            echo "Original size : ${FILE_SIZE_MB} MB"
            echo "Original rate : ${AVG_MBPS} Mbps"
            echo "New size      : ${NEW_SIZE_MB} MB"
            echo "New rate      : ${NEW_MBPS} Mbps"
            echo "=========================================="

          else

            echo "Video là ${AVG_MBPS} Mbps."
            echo "Nhỏ hơn hoặc bằng 3 Mbps."
            echo "Không cần encode."
            echo "Giữ nguyên video gốc."

          fi

      - name: Convert to HLS fMP4 (Segments as PNG)
        run: |
          mkdir -p output
          NAME="${{ github.event.inputs.name }}"
          
          # Giải thích các tham số FFmpeg:
          # -map 0:v:0 -map 0:a? : Lấy video đầu tiên, lấy audio nếu có (không lỗi nếu ko có audio)
          # -c:v copy : Giữ nguyên bitrate/chất lượng video (không encode lại - cực nhanh)
          # -hls_fmp4_init_filename : Đặt tên file init (quan trọng nhất của fMP4) thành .png
          # -hls_segment_filename : Đặt tên các mảnh segment thành .png
          
          ffmpeg -i input_video.mp4 \
            -map 0:v:0 -map 0:a? \
            -c:v copy \
            -c:a aac -b:a 128k \
            -f hls \
            -start_number 10001 \
            -hls_time 6 \
            -hls_list_size 0 \
            -hls_segment_type fmp4 \
            -hls_fmp4_init_filename "${NAME}-index.png" \
            -hls_segment_filename "output/${NAME}-index%d.png" \
            "output/${NAME}.m3u8"
          
          # Kiểm tra xem file m3u8 có được tạo không
          if [ ! -f "output/${NAME}.m3u8" ]; then
            echo "FFmpeg failed to create m3u8"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ github.event.inputs.token }}
          accountId: ${{ github.event.inputs.accountId }}
          projectName: ${{ github.event.inputs.projectName }}
          directory: ./output
          branch: ${{ github.event.inputs.name }}

      - name: Verify Cloudflare deployment (branch domain check)
        id: verify
        continue-on-error: true
        env:
          PROJECT: ${{ github.event.inputs.projectName }}
          BRANCH: ${{ github.event.inputs.name }}
        run: |
          set -e
          FILE_URL="https://${{ github.event.inputs.name }}.${{ github.event.inputs.projectName }}.pages.dev/${{ github.event.inputs.name }}.m3u8"

          echo "[TARGET] $FILE_URL"

          check () {
            code=$(curl -L -o /dev/null -s -w "%{http_code}" "$FILE_URL")
            echo "HTTP CODE: $code"
            [ "$code" = "200" ]
          }

          echo "[WAIT] Waiting 1 minutes for Pages propagation..."
          sleep 60

          echo "[CHECK #1]"
          if check; then
            echo "[SUCCESS] File exists"
            curl -G "https://cp.ssplay.net/cf.php" \
            --data-urlencode "type=ok" \
            --data-urlencode "key=${{ github.event.inputs.projectName }}" \
            --data-urlencode "slug=${{ github.event.inputs.name }}"
            exit 0
          fi

          echo "[WAIT] Still not found, wait extra 3 minutes..."
          sleep 180

          echo "[CHECK #2]"
          if check; then
            echo "[SUCCESS] File exists after delay"
            exit 0
          fi

          echo "[FAIL] File still missing → mark for redeploy"
          echo "NEED_REDEPLOY=true" >> $GITHUB_ENV
          exit 1

      - name: Deploy to Cloudflare Pages (retry – reuse encoded files)
        if: env.NEED_REDEPLOY == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ github.event.inputs.token }}
          accountId: ${{ github.event.inputs.accountId }}
          projectName: ${{ github.event.inputs.projectName }}
          directory: ./output
          branch: ${{ github.event.inputs.name }}
